name: Create release

# Pushing an annotated tag (e.g. v1.0.0) builds everything and publishes a release.
# The release name/body come from the tag annotation.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # Build first so a broken build never produces a release.
  build:
    name: Build
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    secrets: inherit # Android keystore secrets

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    concurrency: publish-release
    permissions:
      contents: write # create the release and upload assets
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts # one sub-directory per artifact name

      - name: Package assets
        run: |
          set -euo pipefail
          mkdir -p release-assets

          for dir in artifacts/*/; do
            name=$(basename "$dir")
            if compgen -G "${dir}*.apk" > /dev/null; then
              # Android: attach the APK as-is
              cp "${dir}"*.apk release-assets/
            else
              # Everything else: zip the export directory
              (cd "$dir" && zip -r -q "$GITHUB_WORKSPACE/release-assets/${name}.zip" .)
            fi
          done

          ls -lh release-assets

      - name: Publish release
        uses: ghalactic/github-release-from-tag@v6
        with:
          assets: |
            - path: release-assets/*

  deploy:
    name: Deploy to itch.io
    # needs: release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { gameData: queens_linux_x86-64, channel: linux_x86-64 }
          - { gameData: queens_linux_x86-32, channel: linux_x86-32 }
          - { gameData: queens_linux_arm64, channel: linux_arm64 }
          - { gameData: queens_macos, channel: macos }
          - { gameData: queens_windows_x86-64, channel: windows_x86-64 }
          - { gameData: queens_windows_x86-32, channel: windows_x86-32 }
          - { gameData: queens_windows_arm64, channel: windows_arm64 }
          - { gameData: queens_web, channel: web }
          - { gameData: Queens.apk, channel: android }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts # one sub-directory per artifact name

      - name: Read version
        id: version
        run: |
          # Only look inside the [application] section, strip CRs, whitespace, and quotes
          VERSION=$(awk '
            /^\[/ { section = $0 }
            section == "[application]" && /^config\/version[[:space:]]*=/ {
              sub(/^[^=]*=[[:space:]]*/, "")
              gsub(/\r|"/, "")
              print
              exit
            }
          ' "project.godot")
 
          if [ -z "$VERSION" ]; then
            echo "::error::No config/version found in [application] section of project.godot"
            echo "::error::Set it in Project Settings > Application > Config > Version"
            exit 1
          fi
 
          echo "Project version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"   # step output

      - name: Deply to itch.io
        uses: KikimoraGames/itch-publish@v0.0.3
        with:
          butlerApiKey: ${{ secrets.ITCH_IO_API_KEY }}
          gameData: artifacts/${{ matrix.gameData }}
          itchUsername: tacticallaptopbag
          itchGameId: queens-test
          buildChannel: ${{ matrix.channel }}
          buildNumber: ${{ steps.version.outputs.version }}

